name: UECI UnrealBuildTool bootstrap
description: Bootstrap a minimal UnrealBuildTool environment from Epic Git + GitDependencies.
author: UECI contributors
branding:
  icon: box
  color: purple
inputs:
  epic-token:
    description: Read-only GitHub token whose account can access EpicGames/UnrealEngine.
    required: true
  engine-ref:
    description: Git ref in EpicGames/UnrealEngine.
    required: false
    default: release
  engine-dir:
    description: Directory used for the blobless/materialized Epic engine view.
    required: false
    default: .ueci/engine
  cache-dir:
    description: UECI GitDependencies cache directory.
    required: false
    default: .ueci/cache
  cache-compressed-packs:
    description: Keep downloaded .gz packs after verified blobs are extracted.
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Set up .NET 8 for UECI
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 8.0.x
    - name: Bootstrap UnrealBuildTool
      shell: bash
      env:
        UECI_EPIC_GITHUB_TOKEN: ${{ inputs.epic-token }}
      run: |
        set -euo pipefail
        extra=()
        if [[ "${{ inputs.cache-compressed-packs }}" != "true" ]]; then
          extra+=(--no-pack-cache)
        fi
        dotnet run --project "$GITHUB_ACTION_PATH/src/Ueci.Cli/Ueci.Cli.csproj" \
          -c Release -- \
          ubt bootstrap \
          --dir "${{ inputs.engine-dir }}" \
          --cache-dir "${{ inputs.cache-dir }}" \
          --ref "${{ inputs.engine-ref }}" \
          "${extra[@]}"
